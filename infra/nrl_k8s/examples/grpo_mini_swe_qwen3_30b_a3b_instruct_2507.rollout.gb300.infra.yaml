# mini-swe-agent rollout-only smoke for Qwen3-30B-A3B-Instruct-2507 via Dynamo.
#
# This variant expects the NeMo-RL Dynamo integration checkout to already exist
# on the shared PVC:
#   /mnt/rl-workspace/${user:}/nemo-rl
#
# It runs one mini-SWE sample in trajectory-collection mode and writes both the
# driver log and Dynamo metrics snapshots to /mnt/rl-workspace/${user:}.

_shared:
  headNodeSelector: &head_node_selector
    nodeGroup: customer-cpu
    kubernetes.io/arch: arm64
  workerNodeSelector: &worker_node_selector
    nvidia.com/gpu.product: NVIDIA-GB300
  userSecretEnvFrom: &user_secret_env_from
    - secretRef:
        name: ${user:}-secrets
        optional: true
  headEnv: &shared_head_env
    - {name: HF_HOME,                       value: "/mnt/rl-workspace/${user:}/hf-cache"}
    - {name: NCCL_DEBUG,                    value: WARN}
    - {name: PYTHONPATH,                    value: "/opt/nemo-rl:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:/opt/nemo-rl/3rdparty/Megatron-LM-workspace/Megatron-LM"}
    - {name: RAY_memory_monitor_refresh_ms, value: "0"}
    # Force per-actor Ray venv rebuild from the PVC-mounted uv.lock at
    # actor spawn; the baked image venv lags new deps introduced upstream
    # (e.g. tensordict from data-plane transfer queue PR #2439).
    - {name: NRL_FORCE_REBUILD_VENVS,       value: "true"}
  workerEnv: &shared_worker_env
    - {name: HF_HOME,                       value: "/mnt/rl-workspace/${user:}/hf-cache"}
    - {name: NCCL_DEBUG,                    value: WARN}
    - {name: PYTHONPATH,                    value: "/opt/nemo-rl:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:/opt/nemo-rl/3rdparty/Megatron-LM-workspace/Megatron-LM"}
    - {name: RAY_memory_monitor_refresh_ms, value: "0"}
    - {name: NRL_FORCE_REBUILD_VENVS,       value: "true"}
  headResources: &head_resources
    limits:   {cpu: "48",  memory: "128Gi"}
    requests: {cpu: "16",  memory: "64Gi"}
  gpuWorkerResources: &gpu_worker_resources
    limits:
      cpu: "48"
      memory: "384Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "24"
      memory: "256Gi"
      nvidia.com/gpu: "1"
  rayPorts: &ray_ports
    - {containerPort: 6379,  name: gcs-server}
    - {containerPort: 8265,  name: dashboard}
    - {containerPort: 10001, name: client}
  codeMounts: &code_mounts
    - {mountPath: /dev/shm,          name: dshm}
    - {mountPath: /opt/nemo-rl,      name: rl-workspace, subPath: "${user:}/nemo-rl"}
    - {mountPath: /mnt/rl-workspace, name: rl-workspace}
  headVolumes: &head_volumes
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
    - name: rl-workspace
      persistentVolumeClaim: {claimName: rl-workspace}
  workerVolumes: &worker_volumes
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 16Gi}
    - name: rl-workspace
      persistentVolumeClaim: {claimName: rl-workspace}
  singularityPostStart: &singularity_post_start
    postStart:
      exec:
        command:
          - /bin/bash
          - -lc
          - |
            set -eu
            exec >>/tmp/postStart.log 2>&1
            if ! command -v singularity >/dev/null 2>&1 || ! command -v squashfuse >/dev/null 2>&1; then
              echo "[postStart] installing singularity-container + squashfuse..."
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                singularity-container squashfuse
            fi
            command -v singularity >/dev/null 2>&1 || { echo "[postStart] singularity install failed"; exit 1; }
            command -v squashfuse  >/dev/null 2>&1 || { echo "[postStart] squashfuse install failed";  exit 1; }
            for i in $(seq 0 63); do
              [ -e /dev/loop$i ] || mknod -m 0660 /dev/loop$i b 7 $i || true
            done
  privilegedSecurityContext: &privileged_security_context
    privileged: true
    capabilities:
      add: [IPC_LOCK]

namespace: default
image: nvcr.io/nvidian/nemo-rl:664d29c-49528955
imagePullSecrets: [nvcr-secret]
serviceAccount: nemo-rl-endpoint-registry

labels:
  nrl-k8s/owner: ${user:}

submit:
  submitter: portForward

launch:
  mode: attach
  runMode: batch
  codeSource: image
  codePath: /opt/nemo-rl
  attach:
    training: ${user:}-rc-mini-swe-qwen3-30b-a3b
  peerWatcher: false
  env: {}
  entrypoint: |
    set -eu
    cd /opt/nemo-rl
    if [ ! -d /mnt/rl-workspace ]; then
      echo "ERROR: /mnt/rl-workspace not mounted; is the rl-workspace PVC bound?" >&2
      exit 1
    fi
    if [ ! -f examples/nemo_gym/grpo_mini_swe_qwen3_30b_a3b_instruct_2507.yaml ]; then
      echo "ERROR: /opt/nemo-rl does not contain grpo_mini_swe_qwen3_30b_a3b_instruct_2507.yaml" >&2
      exit 1
    fi
    command -v singularity >/dev/null 2>&1 || {
      echo "ERROR: singularity not found on PATH; postStart hook failed?" >&2
      exit 1
    }
    echo "[setup] singularity: $(singularity --version 2>&1 | head -1)"

    # Code on /opt/nemo-rl came from rsync (host user uid), but the pod runs
    # as root — git refuses to read repos under a "dubious ownership" check
    # (e.g. mini_swe_simple_agent's `git ls-files`, NeMo-RL's container
    # fingerprint check). Wildcard-trust avoids running `chown` on PVC.
    git config --global --add safe.directory '*' >/dev/null 2>&1 || true

    # The baked driver venv (/opt/nemo_rl_venv) was assembled at image-build
    # time and lags the PVC-mounted uv.lock when new top-level deps land
    # upstream (e.g. tensordict). `uv sync --frozen` reconciles the venv with
    # the current uv.lock — fast no-op when already in sync, ~minutes the
    # first time after an upstream dep bump.
    if command -v uv >/dev/null 2>&1; then
      echo "[setup] reconciling /opt/nemo_rl_venv with uv.lock"
      uv sync --frozen 2>&1 | tail -5 || echo "[setup] uv sync nonzero exit (continuing)"
    fi

    export PYTHONPATH=.:3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:3rdparty/Megatron-LM-workspace/Megatron-LM
    TIMESTAMP=$(date -u +%Y%m%d-%H%M%S-%N)
    LOG_DIR=/mnt/rl-workspace/${user:}/driver_logs
    METRICS_DIR=/mnt/rl-workspace/${user:}/dynamo_metrics
    ONE_SAMPLE=/mnt/rl-workspace/${user:}/swebench_containers/mini_swe_one.jsonl
    LOG=\${LOG_DIR}/${user:}-mini-swe-qwen3-30b-a3b-rollout-\${TIMESTAMP}.log
    mkdir -p "\${LOG_DIR}" "\${METRICS_DIR}" "$(dirname "\${ONE_SAMPLE}")"
    head -n 1 /mnt/rl-workspace/jothomson/swebench_containers/swebench_verified_arm64_mini_swe.jsonl > "\${ONE_SAMPLE}"

    FRONTEND=http://${user:}-swe-q3-30ba3b-frontend.default.svc.cluster.local:8000/v1
    WORKER_METRICS=http://${user:}-swe-q3-30ba3b-vllmdecodeworker.default.svc.cluster.local:9090/metrics
    curl -fsS --max-time 10 "\${WORKER_METRICS}" > "\${METRICS_DIR}/qwen3-30b-a3b-before-\${TIMESTAMP}.prom" || true

    PIPE=$(mktemp -u)
    mkfifo "\${PIPE}"
    tee "\${LOG}" < "\${PIPE}" &
    TEE_PID=$!

    RC=0
    python -u examples/nemo_gym/run_dynamo_rollout_only.py \
      --config examples/nemo_gym/grpo_mini_swe_qwen3_30b_a3b_instruct_2507.yaml \
      +policy.generation.dynamo_cfg.dgd_name=${user:}-swe-q3-30ba3b \
      +policy.generation.dynamo_cfg.frontend_port=8000 \
      env.nemo_gym.is_trajectory_collection=true \
      env.nemo_gym.mini_swe_simple_agent.responses_api_agents.mini_swe_agent.step_limit=1 \
      env.nemo_gym.mini_swe_simple_agent.responses_api_agents.mini_swe_agent.concurrency=1 \
      env.nemo_gym.mini_swe_simple_agent.responses_api_agents.mini_swe_agent.cache_dir_template="'/mnt/rl-workspace/jothomson/swebench_containers/swebench_sweb.eval.arm64.{instance_id}.sif'" \
      env.nemo_gym.policy_model.responses_api_models.vllm_model.uses_reasoning_parser=false \
      data.train.data_path="\${ONE_SAMPLE}" \
      data.validation.data_path="\${ONE_SAMPLE}" \
      > "\${PIPE}" 2>&1 || RC=$?

    curl -fsS --max-time 10 "\${WORKER_METRICS}" > "\${METRICS_DIR}/qwen3-30b-a3b-after-\${TIMESTAMP}.prom" || true

    wait "\${TEE_PID}" || true
    rm -f "\${PIPE}"

    # Co-locate the before/after .prom snapshots into the same exp_NNN/ dir
    # that the python driver just created (we can't know exp_NNN ahead of
    # time, so write to staging METRICS_DIR first, then mv into the latest
    # exp_NNN/ here). The driver auto-increments exp_NNN inside log_dir.
    RESULTS_PARENT=/opt/nemo-rl/logs/grpo-mini-swe-qwen3-30b-a3b-instruct-2507-rollout
    EXP_DIR=$(ls -dt \${RESULTS_PARENT}/exp_* 2>/dev/null | head -1 || true)
    if [ -n "\${EXP_DIR}" ] && [ -d "\${EXP_DIR}" ]; then
      mv "\${METRICS_DIR}/qwen3-30b-a3b-before-\${TIMESTAMP}.prom" "\${EXP_DIR}/" 2>/dev/null || true
      mv "\${METRICS_DIR}/qwen3-30b-a3b-after-\${TIMESTAMP}.prom"  "\${EXP_DIR}/" 2>/dev/null || true
      METRICS_DST="\${EXP_DIR}"
    else
      METRICS_DST="\${METRICS_DIR}"
    fi

    echo "[result] driver_log=\${LOG}"
    echo "[result] frontend=\${FRONTEND}"
    echo "[result] metrics_before=\${METRICS_DST}/qwen3-30b-a3b-before-\${TIMESTAMP}.prom"
    echo "[result] metrics_after=\${METRICS_DST}/qwen3-30b-a3b-after-\${TIMESTAMP}.prom"
    (exit "\${RC}")

kuberay:
  training:
    name: ${user:}-rc-mini-swe-qwen3-30b-a3b
    labels:
      disagg.nemo-rl/cluster: mini-swe-qwen3-30b-a3b
      disagg.nemo-rl/run: mini-swe-qwen3-30b-a3b
      kai.scheduler/queue: rl-${user:}
    spec:
      rayVersion: "2.52.0"
      headGroupSpec:
        rayStartParams:
          dashboard-host: "0.0.0.0"
          no-monitor: "true"
          num-gpus: "0"
          object-store-memory: "100000000"
        template:
          spec:
            schedulerName: kai-scheduler
            dnsPolicy: ClusterFirst
            nodeSelector: *head_node_selector
            containers:
              - name: ray-head
                env: *shared_head_env
                envFrom: *user_secret_env_from
                resources: *head_resources
                ports: *ray_ports
                volumeMounts: *code_mounts
                lifecycle: *singularity_post_start
                securityContext: *privileged_security_context
            volumes: *head_volumes
      workerGroupSpecs:
        - groupName: gpu-workers
          replicas: 0
          minReplicas: 0
          maxReplicas: 0
          rayStartParams:
            num-gpus: "0"
            object-store-memory: "100000000"
          template:
            spec:
              schedulerName: kai-scheduler
              dnsPolicy: ClusterFirst
              nodeSelector: *worker_node_selector
              tolerations:
                - operator: Exists
              containers:
                - name: ray-worker
                  env: *shared_worker_env
                  envFrom: *user_secret_env_from
                  resources: *gpu_worker_resources
                  securityContext: *privileged_security_context
                  lifecycle: *singularity_post_start
                  volumeMounts: *code_mounts
              volumes: *worker_volumes

dynamo:
  serving:
    manifest: ../examples_dgd/qwen3_30b_a3b_instruct_2507_gb300.yaml
    name: ${user:}-swe-q3-30ba3b
    readyTimeoutS: 1800
    # Override the DGD manifest's metadata.annotations so dynamo operator
    # stamps the per-user KAI queue on its pods. dgd.py:234 merges this on
    # top of the manifest's own annotations.
    annotations:
      nvidia.com/kai-scheduler-queue: rl-${user:}
    # Deep-merged onto the DGD spec by dgd.py:192-198. OmegaConf list merge
    # replaces the whole env: list, so we re-list everything the DGD has
    # plus our per-user HF_HOME (points at where `huggingface-cli download`
    # cached the Qwen3-30B-A3B-Instruct-2507 snapshot).
    overrides:
      services:
        VllmDecodeWorker:
          extraPodSpec:
            mainContainer:
              env:
                - name: DYN_HEALTH_CHECK_ENABLED
                  value: "false"
                - name: HF_HOME
                  value: /mnt/rl-workspace/${user:}/hf_home
